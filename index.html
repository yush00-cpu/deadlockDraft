<!DOCTYPE html>
<html lang="es" class="h-full bg-[#0B0D0E]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadlock 1v1 Item Draft</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deadlock: {
                            bg: '#0B0D0E',
                            card: '#161A1E',
                            border: '#2A3038',
                            gold: '#D1A23D',
                            goldHover: '#E5C365',
                            weapon: '#F97316',
                            weaponGlow: 'rgba(249, 115, 22, 0.25)',
                            spirit: '#A162F7',
                            spiritGlow: 'rgba(161, 98, 247, 0.25)',
                            vitality: '#4ADE80',
                            vitalityGlow: 'rgba(74, 222, 128, 0.25)',
                        }
                    },
                    fontFamily: {
                        title: ['Cinzel', 'serif'],
                        body: ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Rajdhani', sans-serif; background-color: #0B0D0E; color: #E2E8F0; }
        .font-title { font-family: 'Cinzel', serif; }
        
        /* 3D Flip Card Animation */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        .card-flip-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-flipped .card-flip-inner {
            transform: rotateY(180deg);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0B0D0E; }
        ::-webkit-scrollbar-thumb { background: #2A3038; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #D1A23D; }

        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF0CA 0%, #D1A23D 50%, #9A701C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-border-glow {
            box-shadow: 0 0 15px rgba(209, 162, 61, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- Header / Navbar -->
    <header class="w-full border-b border-[#2A3038] bg-[#161A1E]/90 px-6 py-4 flex items-center justify-between sticky top-0 z-50 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded bg-gradient-to-br from-[#D1A23D] to-[#8C6212] p-0.5 flex items-center justify-center shadow-lg">
                <div class="w-full h-full bg-[#0B0D0E] rounded flex items-center justify-center">
                    <i data-lucide="crosshair" class="w-5 h-5 text-[#D1A23D]"></i>
                </div>
            </div>
            <div>
                <h1 class="font-title text-xl font-bold tracking-wider gold-gradient-text">DEADLOCK <span class="text-xs px-2 py-0.5 rounded bg-[#D1A23D]/20 text-[#D1A23D] border border-[#D1A23D]/40 font-body">ITEM DRAFT 1v1</span></h1>
                <p class="text-xs text-gray-400">Selección de Héroes, Imágenes Reales e Ítems por Build</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button id="soundToggle" onclick="toggleSound()" class="text-xs flex items-center gap-2 px-3 py-1.5 rounded border border-[#2A3038] hover:border-[#D1A23D] text-gray-300 transition-colors">
                <i data-lucide="volume-2" class="w-4 h-4 text-[#D1A23D]"></i>
                <span id="soundStatus">Sonido: ON</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow container mx-auto px-4 py-6 flex items-center justify-center">
        
        <!-- STEP 1: LOBBY & SETUP -->
        <section id="setupScreen" class="w-full max-w-4xl bg-[#161A1E] border border-[#2A3038] rounded-xl p-6 shadow-2xl relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-72 h-72 bg-[#D1A23D]/10 rounded-full blur-3xl pointer-events-none"></div>

            <h2 class="font-title text-2xl font-bold text-center gold-gradient-text mb-2">CONFIGURACIÓN DE PARTIDA</h2>
            <p class="text-center text-sm text-gray-400 mb-6">Personaliza la sala, elige héroes y configura tus rutas de imágenes o rondas.</p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <!-- Player 1 Setup -->
                <div class="bg-[#0B0D0E] p-4 rounded-lg border border-[#2A3038] focus-within:border-[#D1A23D] transition-all">
                    <label class="block text-xs font-bold text-gray-400 mb-2
